[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-markets-engine"
version = "0.1.0"
description = "Standalone Autonomous Polymarket Multi-Option, Futures & NegRisk Quant Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
